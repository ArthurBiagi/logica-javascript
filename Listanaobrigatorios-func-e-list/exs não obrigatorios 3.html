<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Desafios de Lógica JS</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            line-height: 1.6;
        }

        section {
            border-bottom: 1px solid #ccc;
            padding: 10px 0;
        }
    </style>
</head>

<body>

    <h1>Lista de Exercícios</h1>

    <div class="container">
        <div class="container__conteudo">

                <div class="container__texto">
                    <h1>Resultado:</h1>
                    <p class="texto__paragrafo">Insira os dados para o cálculo do IMC</p>
                </div>
                    <input type="number" id="alturaInput" placeholder="Altura em metros (ex: 1.75)" class="container__input">
                    <input type="number" id="pesoInput" placeholder="Peso em kg (ex: 70)" class="container__input">
                <div class="chute container__botoes">
                    <button onclick="calculoIMC()" class="container__botao">Calcular IMC</button>
                </div>
                <div class="container_botaoF">
                    <button onclick="calculoFatorial()" class="container__botao">Calcular Fatorial</button>
                </div>                    
    <script src="exs não obrigatorios 3.js"></script>
