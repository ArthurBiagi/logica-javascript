<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Desafios de Lógica JS</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            line-height: 1.6;
        }

        section {
            border-bottom: 1px solid #ccc;
            padding: 10px 0;
        }
    </style>
</head>

<body>

    <h1>Lista de Exercícios</h1>

    <div class="container__conteudo">

        <div class="bloco-exercicio">
            <div class="container__texto">
                <h1>Cálculo do IMC</h1>
                <p id="resultadoIMC" class="texto__paragrafo">Insira os dados para o cálculo do IMC</p>
            </div>
            <input type="number" id="alturaInput" placeholder="Altura em metros (ex: 1.75)" class="container__input">
            <input type="number" id="pesoInput" placeholder="Peso em kg (ex: 70)" class="container__input">
            <div class="container__botoes">
                <button onclick="calculoIMC()" class="container__botao">Calcular IMC</button>
            </div>
        </div>

        <div class="bloco-exercicio">
            <div class="container__texto">
                <h1>Cálculo de Fatorial</h1>
                <p id="resultadoFatorial" class="texto__paragrafo">Insira um número para calcular o fatorial</p>
            </div>
            <input type="number" id="fatorialInput" placeholder="Digite um número inteiro" class="container__input">
            <div class="container__botoes">
                <button onclick="calculoFatorial(parseInt(document.getElementById('fatorialInput').value))"
                    class="container__botao">Calcular Fatorial</button>
            </div>
        </div>

        <div class="bloco-exercicio">
            <div class="container__texto">
                <h1>Conversão de Dólar para Real</h1>
                <p id="ResultadoConversao" class="texto__paragrafo">Insira o valor em dólares</p>
            </div>
            <input type="number" id="conversaoInput" placeholder="Valor em dólares" class="container__input">
            <div class="container__botoes">
                <button onclick="converteDolarReais(parseFloat(document.getElementById('conversaoInput').value))"
                    class="container__botao">Converter de Dólar para Real</button>
            </div>
        </div>


    </div>
    <script src="exs não obrigatorios 3.js"></script>
</body>

</html>
